name: SSH Docker Deploy
description: Deploy dockerized service to remote server via SSH

inputs:
  server-user:
    description: SSH username for the target server
    required: true
  server-host:
    description: Hostname or IP address of the target server
    required: true
  ssh-port:
    description: SSH port of the target server
    required: true
  ssh-private-key:
    description: Private SSH key used to connect to the target server
    required: true

  service-folder:
    description: Service directory name under the deployment root
    required: true
  deploy-root:
    description: Root directory for deployments on the target server
    required: false
    default: /opt

  container-name:
    description: Name assigned to the deployed container
    required: true
  image:
    description: Fully qualified container image to deploy
    required: true

  env-file:
    description: Environment file contents for the deployed service
    required: true

  registry-url:
    description: Container registry URL
    required: true
  registry-user:
    description: Container registry username
    required: true
  registry-token:
    description: Container registry access token
    required: true

  docker-network:
    description: Docker network to attach the container to
    required: false
    default: npm_default
  docker-memory:
    description: Docker memory limit for the container
    required: false
    default: 2g
  extra-docker-args:
    description: Additional arguments passed to docker run
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Resolve deploy folder
      id: deploy-folder
      shell: bash
      env:
        DEPLOY_ROOT: ${{ inputs.deploy-root }}
        SERVICE_FOLDER: ${{ inputs.service-folder }}
      run: |
        set -euo pipefail

        if [ -z "$DEPLOY_ROOT" ]; then
          echo "deploy-root must not be empty" >&2
          exit 1
        fi

        SERVICE_FOLDER="${SERVICE_FOLDER#/}"
        if [ -z "$SERVICE_FOLDER" ]; then
          echo "service-folder must not be empty" >&2
          exit 1
        fi

        echo "path=${DEPLOY_ROOT%/}/$SERVICE_FOLDER" >> "$GITHUB_OUTPUT"

    - name: Prepare SSH key
      id: prepare-key
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
      run: |
        set -euo pipefail
        umask 077
        echo "$SSH_PRIVATE_KEY" > ssh_key
        chmod 600 ssh_key
        echo "path=$(pwd)/ssh_key" >> "$GITHUB_OUTPUT"

    - name: Create env file
      shell: bash
      run: |
        set -euo pipefail
        echo "${{ inputs.env-file }}" > app.env

    - name: Prepare remote folders
      shell: bash
      run: |
        set -euo pipefail
        SSH_KEY_PATH="${{ steps.prepare-key.outputs.path }}"
        ssh -i "$SSH_KEY_PATH" -p "${{ inputs.ssh-port }}" -o StrictHostKeyChecking=no \
          "${{ inputs.server-user }}@${{ inputs.server-host }}" \
          "mkdir -p '${{ steps.deploy-folder.outputs.path }}'; cd '${{ steps.deploy-folder.outputs.path }}'; touch .env"

    - name: Upload env file
      shell: bash
      run: |
        set -euo pipefail
        SSH_KEY_PATH="${{ steps.prepare-key.outputs.path }}"
        scp -i "$SSH_KEY_PATH" -P "${{ inputs.ssh-port }}" -o StrictHostKeyChecking=no \
          app.env "${{ inputs.server-user }}@${{ inputs.server-host }}:${{ steps.deploy-folder.outputs.path }}/.env"
        rm -f app.env

    - name: Docker deploy
      shell: bash
      run: |
        set -euo pipefail
        SSH_KEY_PATH="${{ steps.prepare-key.outputs.path }}"

        ssh -i "$SSH_KEY_PATH" -p "${{ inputs.ssh-port }}" -o StrictHostKeyChecking=no \
          "${{ inputs.server-user }}@${{ inputs.server-host }}" "
            cd '${{ steps.deploy-folder.outputs.path }}';

            echo '${{ inputs.registry-token }}' | docker login '${{ inputs.registry-url }}' \
              --username '${{ inputs.registry-user }}' \
              --password-stdin;

            docker pull '${{ inputs.image }}';
            docker container rm -f '${{ inputs.container-name }}' || true;

            docker network inspect '${{ inputs.docker-network }}' >/dev/null 2>&1 || \
              docker network create '${{ inputs.docker-network }}';

            docker run -d -i \
              --name '${{ inputs.container-name }}' \
              --env-file ./.env \
              --network='${{ inputs.docker-network }}' \
              --memory='${{ inputs.docker-memory }}' \
              --restart=always \
              --volume '${{ steps.deploy-folder.outputs.path }}/files:/app/files' \
              ${{ inputs.extra-docker-args }} \
              '${{ inputs.image }}';

            docker image prune -a -f;
          "

    - name: Cleanup SSH key
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        SSH_KEY_PATH="${{ steps.prepare-key.outputs.path }}"
        rm -f "$SSH_KEY_PATH" || true
