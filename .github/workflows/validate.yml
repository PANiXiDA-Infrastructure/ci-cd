name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Validate action metadata
        uses: mpalmer/action-validator@c994f427b7c42cd5ecb1bc9315cb91c3d7d72e3d # v0.9.0
        with:
          version: 0.9.0
          patterns: |
            :(glob).github/actions/*/action.yml

  notify:
    if: ${{ always() && github.event_name == 'push' && github.ref_name == 'main' }}
    needs: [ actionlint ]
    uses: PANiXiDA-Infrastructure/ci-cd/.github/workflows/notify-telegram.yml@main
    with:
      event-name: ${{ github.event_name }}
    secrets:
      telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      telegram-chat-id: ${{ vars.TELEGRAM_CHAT_ID }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
